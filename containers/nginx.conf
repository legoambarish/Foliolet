pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_max_body_size 21m;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  proxy_read_timeout 240s;
  proxy_set_header Host $http_host;
  proxy_set_header Connection "";
  proxy_http_version 1.1;
  server {
    listen 8008;
    location / { proxy_pass http://127.0.0.1:8000; }
  }
  # Different listener ports let the actual application remain loopback-bound.
  server {
    listen 8098;
    location / { proxy_pass http://127.0.0.1:8088; }
  }
  server {
    listen 8549;
    location / {
      proxy_pass http://127.0.0.1:8548;
      proxy_hide_header Access-Control-Allow-Origin;
      add_header Access-Control-Allow-Origin "http://127.0.0.1:8008" always;
      add_header Access-Control-Allow-Headers "Content-Type" always;
      add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
      if ($request_method = OPTIONS) { return 204; }
    }
  }
}
