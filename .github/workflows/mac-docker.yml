name: Mac Docker product
on:
  push:
    branches: [codex/macos-docker]
    paths-ignore: ['docs/**', README.md]
  pull_request:
    branches: [codex/macos-docker]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-checks:
    name: Host checks (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22', cache: npm, cache-dependency-path: spring-boot-service/package-lock.json}
      - name: Install locked application dependencies
        run: |
          python -m pip install -r django-service/requirements.txt -r tools/requirements-dev.txt
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix spring-boot-service
      - name: Native host regression and launcher checks
        env:
          FOLIOLET_STATE_DIR: ${{ runner.temp }}/foliolet-host-tests
        run: |
          bash -n foliolet Foliolet.command containers/install-docker-mac.sh
          python containers/test_launcher.py
          python containers/test_container_config.py
          python tools/test-intake-watcher.py
          python django-service/manage.py test dashboard --noinput
          node tools/build-frontend-assets.cjs
          node spring-boot-service/scripts/compile-contracts.cjs
          node --test spring-boot-service/scripts/test-proof-security.cjs spring-boot-service/scripts/test-verifier-ui.cjs tools/test-share-qr.cjs
          node spring-boot-service/scripts/test-contracts.cjs

  docker-acceptance:
    name: Full Docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    env:
      FOLIOLET_NO_OPEN: '1'
      FOLIOLET_SKIP_BUILD: '1'
      FOLIOLET_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production image (Java, Python, OCR and Node tests run inside build)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: containers/Dockerfile
          target: runtime
          load: true
          tags: foliolet-local:mac
          cache-from: type=gha,scope=mac-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=mac-${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Prove the built image contains no initialized developer vault/configuration
        run: docker run --rm --network none --read-only --entrypoint python foliolet-local:mac /app/containers/test_image.py
      - name: Build isolated fictional-data test image
        run: docker buildx build --target acceptance --load -f containers/Dockerfile -t foliolet-test:mac .
      - name: One-command start from empty persistent volumes
        run: |
          ./foliolet config
          ./foliolet up
          ./foliolet status
      - name: Real HTTP, managed watcher, PDFBox, Tesseract, Ollama, EVM and security acceptance
        run: ./foliolet test
      - name: Browser dependencies and fictional fixtures
        run: |
          python -m pip install -r tools/requirements-foli-test.txt
          npm ci --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/foliolet-browser" --no-save playwright@1.56.1
          "$RUNNER_TEMP/foliolet-browser/node_modules/.bin/playwright" install --with-deps chromium
          python tools/make-intake-fixtures.py
          python tools/make-ocr-benchmark.py
      - name: Real browser consent, OCR review, edited lineage and independent disclosure
        env:
          FOLI_BROWSER_CHANNEL: chromium
        run: |
          export FOLI_PLAYWRIGHT_MODULE="$RUNNER_TEMP/foliolet-browser/node_modules/playwright"
          node tools/test-intake-ui.cjs
          node tools/test-ocr-intake-ui.cjs
      - name: Stop/recreate retains database, originals, keys, EVM and trust pins
        run: |
          export FOLIOLET_INTAKE_DIR="$HOME/Downloads/Foliolet Intake"
          docker compose -f compose.mac.yaml --profile test run --rm --no-deps test-runner python /app/containers/test_stack.py --persistence-write
          ./foliolet down
          ./foliolet up
          docker compose -f compose.mac.yaml --profile test run --rm --no-deps test-runner python /app/containers/test_stack.py --persistence-read
      - name: Export safe acceptance reports
        if: always()
        run: |
          mkdir -p ci-results
          export FOLIOLET_INTAKE_DIR="$HOME/Downloads/Foliolet Intake"
          docker compose -f compose.mac.yaml logs --no-color --tail=150 > ci-results/services.log 2>&1 || true
          docker compose -f compose.mac.yaml cp backend:/app/.local-data/intake-tests/live-results.json ci-results/live-results.json || true
          docker compose -f compose.mac.yaml cp backend:/app/.local-data/intake-tests/failure-results.json ci-results/failure-results.json || true
          docker compose -f compose.mac.yaml cp backend:/app/.local-data/intake-tests/docker-managed-results.json ci-results/docker-managed-results.json || true
          cp .local-data/intake-tests/ui-results.json ci-results/ 2>/dev/null || true
          cp .local-data/ocr-p0/walkthrough/results.json ci-results/ocr-ui-results.json 2>/dev/null || true
          docker image inspect foliolet-local:mac --format '{{.Architecture}} {{.Size}}' > ci-results/image-size.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: acceptance-${{ matrix.arch }}
          path: ci-results/
          retention-days: 14
      - name: Authenticate for tested-image delivery
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/macos-docker'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Push only this tested architecture
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/macos-docker'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${REPOSITORY,,}/mac-product"
          docker tag foliolet-local:mac "$image:$COMMIT-$ARCH"
          docker push "$image:$COMMIT-$ARCH"
      - name: Stop ephemeral CI services without removing volumes
        if: always()
        run: ./foliolet down

  deliver:
    name: Deliver tested Intel + Apple Silicon image
    needs: [host-checks, docker-acceptance]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/macos-docker'
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Assemble immutable multi-platform manifest after every gate passes
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}/mac-product"
          docker buildx imagetools create -t "$image:$COMMIT" -t "$image:mac-test" "$image:$COMMIT-amd64" "$image:$COMMIT-arm64"
          docker buildx imagetools inspect "$image:$COMMIT" | tee manifest.txt
          printf 'Tested image: `%s:%s`\n\n' "$image" "$COMMIT" >> "$GITHUB_STEP_SUMMARY"
          printf 'Use the manifest Digest with `FOLIOLET_IMAGE=image@sha256:digest ./foliolet deploy`.\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Native Docker acceptance: Linux AMD64 and ARM64. Native launcher/companion checks: Intel and Apple Silicon macOS. Physical Mac Docker Desktop acceptance requires the optional Mac deployment workflow.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: tested-multiplatform-manifest, path: manifest.txt}
