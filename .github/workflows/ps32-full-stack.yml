name: PS32 full-stack evidence
on:
  push:
    branches: [feature/ps32-final-winning-audit-20261016-1645]
    paths: ['.github/workflows/ps32-full-stack.yml', 'tools/ps32-live-checks.py', 'spring-boot-service/pom.xml', 'django-service/requirements.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ps32-full-stack
  cancel-in-progress: false
jobs:
  full-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wallet
          POSTGRES_DB: wallet_intake_demo
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55438:5432']
        options: --health-cmd "pg_isready -U wallet -d wallet_intake_demo" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONUNBUFFERED: '1'
      MAVEN_OPTS: '-Xmx1536m'
      WALLET_TEST_API: http://127.0.0.1:8088
      WALLET_TEST_UI: http://127.0.0.1:8008
      WALLET_TEST_RPC: http://127.0.0.1:8548
      WALLET_TEST_DSN: host=127.0.0.1 port=55438 dbname=wallet_intake_demo user=wallet
      INTAKE_TEST_DSN: host=127.0.0.1 port=55438 dbname=wallet_intake_demo user=wallet
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: '8088'
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:55438/wallet_intake_demo
      SPRING_DATASOURCE_USERNAME: wallet
      SPRING_DATASOURCE_PASSWORD: ''
      BLOCKCHAIN_RPC_URL: http://127.0.0.1:8548
      BLOCKCHAIN_CHAIN_ID: '1337'
      WALLET_SHARE_BASE_URL: http://127.0.0.1:8008
      SPRING_BOOT_API_BASE_URL: http://127.0.0.1:8088
      PUBLIC_EVM_RPC_URL: http://127.0.0.1:8548
      FOLIOLET_SHARE_MODE: local
      OPENROUTER_API_KEY: ''
      FOLI_OLLAMA_URL: http://127.0.0.1:11434
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare exact isolated dependencies
        run: |
          set -euo pipefail
          test ! -e .local-data
          umask 077
          mkdir -p .local-data/ps32-private audit-evidence
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
          python -m pip install -r django-service/requirements.txt -r tools/requirements-dev.txt -r tools/requirements-foli-test.txt -r tools/requirements-ocr.txt psutil==7.0.0
          npm ci
          npm --prefix spring-boot-service ci
          npm install --prefix "$RUNNER_TEMP/ps32-browser" --no-save playwright@1.62.0
          node "$RUNNER_TEMP/ps32-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "FOLI_PLAYWRIGHT_MODULE=$RUNNER_TEMP/ps32-browser/node_modules/playwright" >> "$GITHUB_ENV"
          echo "NODE_PATH=$GITHUB_WORKSPACE/spring-boot-service/node_modules" >> "$GITHUB_ENV"
          echo "FOLI_LAYOUT_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "FOLI_LAYOUT_SCRIPT=$GITHUB_WORKSPACE/tools/ocr-layout-worker.py" >> "$GITHUB_ENV"
          git rev-parse HEAD > audit-evidence/HEAD.txt
          python -m pip freeze > audit-evidence/python-freeze.txt
          { java -version; node --version; tesseract --version; } > audit-evidence/runtime-versions.txt 2>&1
      - name: Build real application and fixtures
        run: |
          set -euo pipefail
          npm run contracts:build
          (cd spring-boot-service && bash mvnw -B -ntp -DskipTests package dependency:build-classpath -Dmdep.outputFile=target/ocr-benchmark.classpath) > audit-evidence/build.txt 2>&1
          python tools/make-ocr-benchmark.py
          python tools/make-intake-fixtures.py
          (cd django-service && python manage.py migrate --noinput) > audit-evidence/django-migrate.txt 2>&1
      - name: Start owned loopback services
        run: |
          set -euo pipefail
          umask 077
          node tools/digilocker-evm.cjs > .local-data/ps32-private/evm.log 2>&1 &
          echo "PS32_EVM_PID=$!" >> "$GITHUB_ENV"
          for n in $(seq 1 40); do curl -fsS -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8548 >/dev/null && break; sleep 1; done
          export BLOCKCHAIN_PRIVATE_KEY="$(cat .local-data/development-relay.key)"
          (cd spring-boot-service && exec java -Xmx768m -jar target/dms-0.0.1-SNAPSHOT.jar) > .local-data/ps32-private/backend.log 2>&1 &
          echo "PS32_BACKEND_PID=$!" >> "$GITHUB_ENV"
          ready=false
          for n in $(seq 1 90); do if curl -fsS http://127.0.0.1:8088/api/public/network >/dev/null; then ready=true; break; fi; sleep 1; done
          test "$ready" = true
          node tools/provision-digilocker-trust.cjs
          (cd django-service && exec python manage.py runserver 127.0.0.1:8008 --noreload) > .local-data/ps32-private/django.log 2>&1 &
          echo "PS32_DJANGO_PID=$!" >> "$GITHUB_ENV"
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8008/login/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8008/login/ >/dev/null
      - name: Actual lifecycle
        id: lifecycle
        continue-on-error: true
        run: python tools/test-live-workflow.py > audit-evidence/lifecycle.txt 2>&1
      - name: Actual authorization and proof attacks
        id: attacks
        continue-on-error: true
        run: python tools/test-live-security.py > audit-evidence/live-security.txt 2>&1
      - name: Actual browser upload-to-proof
        id: browser
        continue-on-error: true
        run: node tools/test-ocr-intake-ui.cjs > audit-evidence/browser.txt 2>&1
      - name: Watcher OCR and QR
        id: helpers
        continue-on-error: true
        run: |
          set -euo pipefail
          python tools/test-intake-watcher.py > audit-evidence/watcher.txt 2>&1
          python tools/test-ocr-layout-worker.py > audit-evidence/ocr-worker.txt 2>&1
          node tools/test-share-qr.cjs > audit-evidence/qr.txt 2>&1
      - name: Missing dependencies and interrupted jobs
        id: failures
        continue-on-error: true
        run: |
          set -euo pipefail
          FOLI_LAYOUT_PYTHON='' FOLI_LAYOUT_SCRIPT='' python tools/test-intake-failures.py > audit-evidence/failures.txt 2>&1
          python -c "import runpy; runpy.run_path('tools/test-intake-live.py')['formats_only']()" > audit-evidence/formats.txt 2>&1
      - name: Signature browser flow and actual service restarts
        id: resilience
        continue-on-error: true
        env:
          PS32_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python tools/ps32-live-checks.py > audit-evidence/resilience.txt 2>&1
      - name: Preserve non-secret evidence
        if: always()
        env:
          LIFECYCLE: ${{ steps.lifecycle.outcome }}
          ATTACKS: ${{ steps.attacks.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          HELPERS: ${{ steps.helpers.outcome }}
          FAILURES: ${{ steps.failures.outcome }}
          RESILIENCE: ${{ steps.resilience.outcome }}
        run: |
          python - <<'PY'
          import json,os,pathlib,re,shutil
          out=pathlib.Path('audit-evidence');out.mkdir(exist_ok=True)
          status={n:os.environ[n] for n in ('LIFECYCLE','ATTACKS','BROWSER','HELPERS','FAILURES','RESILIENCE')}
          (out/'outcomes.json').write_text(json.dumps(status,indent=2))
          for name in ('live-test-results.json','live-security-results.json','intake-tests/failure-results.json','intake-tests/format-results.json','ocr-p0/walkthrough/results.json'):
              source=pathlib.Path('.local-data')/name
              if source.is_file():shutil.copyfile(source,out/name.replace('/','-'))
          for source in pathlib.Path('.local-data/ocr-p0/walkthrough').glob('*.png'):shutil.copyfile(source,out/source.name)
          for source in pathlib.Path('.local-data/ps32-private').glob('*.log'):
              text=source.read_text(errors='replace')[-50000:]
              text=re.sub(r'(?i)(/api/public/disclosures/|/verify/)[a-z0-9_-]{30,}',r'\1[REDACTED]',text)
              text=re.sub(r'(?i)(password|authorization|private.key)(["\s:=]+)[^\s,}]+',r'\1\2[REDACTED]',text)
              (out/(source.stem+'-diagnostic.txt')).write_text(text)
          for source in out.glob('*.txt'):
              source.write_text(re.sub(r'(?i)(/api/public/disclosures/|/verify/)[a-z0-9_-]{30,}',r'\1[REDACTED]',source.read_text(errors='replace')))
          print(json.dumps(status,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ps32-full-stack-${{ github.sha }}
          path: audit-evidence/
          retention-days: 14
      - name: Stop only owned services
        if: always()
        run: |
          for pid in "${PS32_DJANGO_PID:-}" "${PS32_BACKEND_PID:-}" "${PS32_EVM_PID:-}"; do
            if test -n "$pid"; then kill "$pid" 2>/dev/null || true; fi
          done
      - name: Require every acceptance phase
        if: always()
        run: python -c "import json; r=json.load(open('audit-evidence/outcomes.json')); assert r and all(v=='success' for v in r.values()),r"
