name: PS32 release evidence
on:
  push:
    branches: [feature/ps32-final-winning-audit-20261016-1645]
    paths: ['.github/workflows/ps32-release-evidence.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Resolve final dependencies and preserve exact source
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          (cd spring-boot-service && bash mvnw -B -ntp dependency:list -DoutputFile=target/release-dependencies.txt -DincludeScope=runtime) > release-evidence/build.txt 2>&1
          cp spring-boot-service/target/release-dependencies.txt release-evidence/java-dependencies.txt
          python3 - <<'PY'
          import json,pathlib,re,urllib.request
          queries=[]
          for line in pathlib.Path('release-evidence/java-dependencies.txt').read_text().splitlines():
              m=re.match(r'\s+([\w.\-]+):([\w.\-]+):jar:([^: ]+):(compile|runtime)',line)
              if m:
                  g,a,v,_=m.groups();queries.append({'package':{'ecosystem':'Maven','name':g+':'+a},'version':v})
          assert queries
          request=urllib.request.Request('https://api.osv.dev/v1/querybatch',data=json.dumps({'queries':queries}).encode(),headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=90) as response:result=json.load(response)
          records=[{'dependency':q,**r} for q,r in zip(queries,result['results'])]
          pathlib.Path('release-evidence/java-osv.json').write_text(json.dumps(records,indent=2))
          summary={'resolvedDependenciesQueried':len(records),'dependenciesWithAdvisoryMatches':sum(bool(r.get('vulns')) for r in records),'scope':'Public Maven names and versions only; feed results are not an absence-of-vulnerabilities guarantee'}
          pathlib.Path('release-evidence/dependency-summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary))
          PY
          git merge-base --is-ancestor db55c2c6c1209e567713fa9ab08c5441bd55bc86 HEAD
          git diff --check db55c2c6c1209e567713fa9ab08c5441bd55bc86 HEAD
          git rev-parse HEAD > release-evidence/HEAD.txt
          git log --format='%H %s' db55c2c6c1209e567713fa9ab08c5441bd55bc86..HEAD > release-evidence/commits.txt
          git diff --stat db55c2c6c1209e567713fa9ab08c5441bd55bc86 HEAD > release-evidence/change-stat.txt
          git archive --format=zip HEAD -o release-evidence/source.zip
          git bundle create release-evidence/source.bundle HEAD
          sha256sum release-evidence/source.zip release-evidence/source.bundle > release-evidence/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ps32-release-${{ github.sha }}
          path: release-evidence/
          retention-days: 14
