name: PS32 licensed public research inputs
on:
  push:
    branches: [feature/ps32-verified-hardening-20261016-6db30e1]
    paths: [.github/workflows/ps32-public-research-inputs.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  permitted-inputs:
    if: github.ref == 'refs/heads/feature/ps32-verified-hardening-20261016-6db30e1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare isolated optional engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-inputs" "$RUNNER_TEMP/ocr-offline/wheels"
          python -m venv "$RUNNER_TEMP/ocr-env"
          "$RUNNER_TEMP/ocr-env/bin/python" -m pip install 'rapidocr==3.10.0' onnxruntime requests Pillow wheel > "$RUNNER_TEMP/ocr-offline/install.txt" 2>&1
          "$RUNNER_TEMP/ocr-env/bin/python" -m pip freeze > "$RUNNER_TEMP/ocr-offline/requirements-frozen.txt"
      - name: Retrieve licensed CORD v2 development and untouched evaluation samples
        shell: bash
        run: |
          "$RUNNER_TEMP/ocr-env/bin/python" - <<'PY'
          import os,json,hashlib,pathlib,requests,time,urllib.parse
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'public-inputs'
          source='https://huggingface.co/datasets/naver-clova-ix/cord-v2'
          records=[]
          for split,count,role in [('train',6,'development'),('test',12,'holdout')]:
              response=requests.get('https://datasets-server.huggingface.co/rows',params={'dataset':'naver-clova-ix/cord-v2','config':'default','split':split,'offset':0,'length':count},timeout=60)
              response.raise_for_status()
              for entry in response.json()['rows']:
                  index=entry['row_idx']; data=entry['row']; url=data['image']['src']
                  parsed=urllib.parse.urlparse(url)
                  if parsed.scheme!='https' or not (parsed.hostname.endswith('.huggingface.co') or parsed.hostname=='huggingface.co'): raise ValueError('Unexpected public dataset image host')
                  image=requests.get(url,timeout=60);image.raise_for_status()
                  if len(image.content)>25_000_000: raise ValueError('Image size budget')
                  name=f'cord-{split}-{index:03d}'
                  (root/(name+'.png')).write_bytes(image.content)
                  gt=json.loads(data['ground_truth'])
                  (root/(name+'.json')).write_text(json.dumps(gt,ensure_ascii=False,indent=2))
                  records.append({'id':name,'dataset_split':split,'index':index,'role':role,'sha256':hashlib.sha256(image.content).hexdigest(),'bytes':len(image.content),'source':source,'license':'CC-BY-4.0','attribution':'CORD authors / NAVER CLOVA; see https://github.com/clovaai/cord','alterations':'none; original licensed dataset image'})
          (root/'provenance.json').write_text(json.dumps({'dataset':source,'license':'CC-BY-4.0','purpose':'local document extraction benchmark, not issuer verification','private_user_documents':False,'selection':'first 6 train rows development; first 12 test rows holdout, selected before inference','records':records},indent=2))
          print('Licensed public input count:',len(records))
          PY
      - name: Initialize RapidOCR on synthetic pixels and preserve models
        shell: bash
        run: |
          "$RUNNER_TEMP/ocr-env/bin/python" - <<'PY'
          import os,pathlib,hashlib,json,shutil,time
          from PIL import Image,ImageDraw
          import rapidocr
          from rapidocr import RapidOCR
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ocr-offline'
          image=Image.new('RGB',(640,180),'white');ImageDraw.Draw(image).text((30,55),'SYNTHETIC TEST 12345',fill='black')
          start=time.perf_counter(); engine=RapidOCR(); result=engine(image)
          print('Optional engine synthetic initialization completed; no public holdout inference yet')
          package=pathlib.Path(rapidocr.__file__).parent
          models=[]
          for path in package.rglob('*.onnx'):
              target=root/'models'/path.name;target.parent.mkdir(exist_ok=True);shutil.copy2(path,target)
              models.append({'name':path.name,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'bytes':path.stat().st_size})
          (root/'engine-preflight.json').write_text(json.dumps({'rapidocr':'3.10.0','initialization_seconds':time.perf_counter()-start,'models':models,'public_holdout_inference':'NOT_RUN'},indent=2))
          PY
      - name: Export Python 3.13 compatible optional dependencies
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ocr-offline'
          lines=(root/'requirements-frozen.txt').read_text().splitlines()
          (root/'requirements-wheels.txt').write_text('\n'.join(s for s in lines if not s.lower().startswith('antlr4-python3-runtime'))+'\n')
          PY
          "$RUNNER_TEMP/ocr-env/bin/python" -m pip wheel --no-deps -w "$RUNNER_TEMP/ocr-offline/wheels" antlr4-python3-runtime==4.9.3 >> "$RUNNER_TEMP/ocr-offline/wheel-download.txt" 2>&1
          python -m pip download --python-version 3.13 --only-binary=:all: --no-deps -d "$RUNNER_TEMP/ocr-offline/wheels" -r "$RUNNER_TEMP/ocr-offline/requirements-wheels.txt" >> "$RUNNER_TEMP/ocr-offline/wheel-download.txt" 2>&1
      - name: Preserve licensed public inputs separately from code
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ps32-cord-licensed-public-inputs
          path: ${{ runner.temp }}/public-inputs
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve optional engine prerequisites
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ps32-rapidocr-offline-prerequisites
          path: ${{ runner.temp }}/ocr-offline
          retention-days: 1
          if-no-files-found: warn
