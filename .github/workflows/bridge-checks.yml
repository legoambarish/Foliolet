name: Evidence Bridge checks
on:
  push:
    branches: [testbuilds]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17', cache: maven, cache-dependency-path: spring-boot-service/pom.xml}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: npm ci --prefix spring-boot-service
      - run: node spring-boot-service/scripts/compile-contracts.cjs && git diff --exit-code -- spring-boot-service/src/main/resources/solidity/SelectiveDisclosureRegistry spring-boot-service/src/main/resources/solidity/EvidenceBridgeRegistry
      - run: node --test spring-boot-service/scripts/test-proof-security.cjs spring-boot-service/scripts/test-verifier-ui.cjs spring-boot-service/scripts/test-bridge-contracts.cjs
      - run: node spring-boot-service/scripts/test-contracts.cjs
      - name: Record development dependency audit
        run: npm audit --prefix spring-boot-service --json > dependency-audit.json || test -s dependency-audit.json
      - run: chmod +x spring-boot-service/mvnw && spring-boot-service/mvnw -f spring-boot-service/pom.xml clean verify
      - run: pip install -r django-service/requirements.txt && python django-service/manage.py test dashboard
      - run: python tools/scan-source-secrets.py
      - run: docker compose config --quiet && docker compose up --build -d --wait --wait-timeout 240
      - run: mkdir -p .bridge-data/config && docker compose cp seed:/config/bridge-pins.json .bridge-data/config/bridge-pins.json
      - run: node spring-boot-service/scripts/test-bridge-live.cjs && node spring-boot-service/scripts/test-bridge-workflows.cjs
      - if: always()
        run: docker compose logs --no-color > compose-ci.log && docker compose down -v
