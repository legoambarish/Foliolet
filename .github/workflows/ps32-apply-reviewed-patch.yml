name: PS32 reviewed patch transport
on:
  push:
    branches: [feature/ps32-final-winning-audit-20261016-1645]
    paths:
      - 'docs/ps32-final/patches/active.patch'
      - '.github/workflows/ps32-apply-reviewed-patch.yml'
permissions:
  contents: read
concurrency:
  group: ps32-reviewed-patch-transport
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'legoambarish/Foliolet' && github.ref == 'refs/heads/feature/ps32-final-winning-audit-20261016-1645'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Apply reviewed patch without executing application code
        shell: bash
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          python - <<'PY'
          import subprocess
          patch = 'docs/ps32-final/patches/active.patch'
          rows = subprocess.check_output(['git', 'apply', '--numstat', patch], text=True).splitlines()
          if not rows:
              raise SystemExit('Empty patch')
          for row in rows:
              path = row.split('\t', 2)[2]
              if not path.startswith(('spring-boot-service/src/', 'django-service/', 'tools/', 'docs/ps32-final/')):
                  raise SystemExit('Patch path is outside reviewed application/evidence scope: ' + path)
              if '..' in path.split('/') or '/.local-data/' in path or path.endswith(('.key', '.pem', '.env', '.sqlite3')):
                  raise SystemExit('Unsafe patch path')
          subprocess.run(['git', 'apply', '--check', '--index', patch], check=True)
          subprocess.run(['git', 'apply', '--index', patch], check=True)
          PY
          git diff --cached --check
          git config user.name 'Foliolet PS32 audit'
          git config user.email '113833803+legoambarish@users.noreply.github.com'
          git commit -m 'fix(audit): apply reviewed production corrections with adversarial coverage'
      - name: Fast-forward only the isolated branch with an exact lease
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='feature/ps32-final-winning-audit-20261016-1645'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          remote=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote" = "$GITHUB_SHA" || { echo 'Branch advanced; refusing to overwrite concurrent progress.'; exit 1; }
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
