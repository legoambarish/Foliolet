services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: wallet_dev
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - wallet_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  wallet_postgres:
