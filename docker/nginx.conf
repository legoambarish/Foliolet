daemon off;
worker_processes 1;
pid /tmp/foliolet-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_max_body_size 21m;
    client_body_temp_path /tmp/foliolet-nginx-body;
    proxy_temp_path /tmp/foliolet-nginx-proxy;
    # Private Django still sees loopback requests, preserving its local guards.
    server {
        listen 8000;
        server_name localhost 127.0.0.1;
        if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 444; }
        location /static/ { alias /app/static/; }
        location / {
            proxy_pass http://127.0.0.1:8008;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_read_timeout 180s;
            proxy_redirect off;
        }
    }
    server {
        listen 8549;
        server_name localhost 127.0.0.1;
        client_max_body_size 1m;
        location / {
            proxy_pass http://127.0.0.1:8548;
            proxy_set_header Host 127.0.0.1;
        }
    }
}
